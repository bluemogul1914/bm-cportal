# Blue Mogul Suite — standalone deployment (bundled PostgreSQL, no external DB)
#
# One-command bring-up: app + its own PostgreSQL. No Neon, no Coolify, no
# managed database required.
#
#   cp .env.example .env      # set POSTGRES_PASSWORD, SESSION_SECRET, PORTAL_SECRET
#   docker compose up -d --build
#   open http://localhost:3000
#
# The app auto-migrates (runPortalMigrations) and seeds on first boot.
#
# Decision 2026-09-20 (Tracey): this bundled stack is the portability target for
# the portal — the product must stand up on any Docker host we control, without
# Neon's account or Coolify's control plane. Coolify + Neon are retired for the
# portal once the cutover is verified.

services:
  db:
    # Major version tracks the production source of truth. Neon runs 18.6, and
    # pg_restore requires a server at least as new as the dump, so a 16 server
    # here could not accept a dump taken from production.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bluemogul_portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Postgres 18 images store data in a major-version-specific subdirectory
      # (PGDATA=/var/lib/postgresql/18/docker) and REFUSE TO START if a volume is
      # mounted at the legacy /var/lib/postgresql/data path. Mount the parent, not
      # .../data, or the container exits 1 in a restart loop.
      - portal_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d bluemogul_portal"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [portal]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Point the app at the bundled Postgres (no Neon/external DB).
      # The password MUST be interpolated: a literal value here cannot match
      # POSTGRES_PASSWORD above, and the app fails to authenticate on boot.
      DATABASE_URL: postgres://portal:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/bluemogul_portal
      # Public URL for links, redirects, and payments. Change to your domain.
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      # Separate secret for external webhook authentication. When unset,
      # falls back to SESSION_SECRET (not ideal — see Security Audit #2).
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      # Key material for the credential vault (AES-256-GCM, key derived via
      # HKDF). REQUIRED when credentials are used: without it the vault cannot
      # encrypt or decrypt, so stored secrets are unrecoverable. Do not rotate
      # it casually.
      PORTAL_SECRET: ${PORTAL_SECRET:?set PORTAL_SECRET in .env}
      # true = read-only deployment: mutating endpoints are blocked and the sync
      # cron is disabled, so a preview sharing production data cannot alter it.
      PORTAL_SAFE_MODE: ${PORTAL_SAFE_MODE:-false}
      # Seeds the first admin account on a fresh install.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # ── Optional: AI ────────────────────────────────────────────────────
      # AnythingLLM is preferred over Ollama when set. Without either, the
      # portal's AI assistant has no engine to call.
      ANYTHINGLLM_URL: ${ANYTHINGLLM_URL:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      # ── Optional: payments ──────────────────────────────────────────────
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
      # ── Optional: accounting (Xero = ledger of record, Wave = secondary) ─
      WAVE_TOKEN: ${WAVE_TOKEN:-}
      WAVE_API_URL: ${WAVE_API_URL:-}
      XERO_CLIENT_ID: ${XERO_CLIENT_ID:-}
      XERO_CLIENT_SECRET: ${XERO_CLIENT_SECRET:-}
      XERO_TENANT_ID: ${XERO_TENANT_ID:-}
      XERO_OAUTH_CLIENT_ID: ${XERO_OAUTH_CLIENT_ID:-}
      XERO_OAUTH_CLIENT_SECRET: ${XERO_OAUTH_CLIENT_SECRET:-}
      XERO_OAUTH_REDIRECT_URI: ${XERO_OAUTH_REDIRECT_URI:-}
      # ── Optional: outbound mail ─────────────────────────────────────────
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # ── Optional: infrastructure reporting ──────────────────────────────
      GRAFANA_URL: ${GRAFANA_URL:-}
      UPTIME_KUMA_URL: ${UPTIME_KUMA_URL:-}
      HOSTWINDS_API_URL: ${HOSTWINDS_API_URL:-}
      HOSTWINDS_API_EMAIL: ${HOSTWINDS_API_EMAIL:-}
      HOSTWINDS_API_KEY: ${HOSTWINDS_API_KEY:-}
      # ── Optional: CRM bridge ────────────────────────────────────────────
      # Most provider credentials live in the system_settings table (set them in
      # the admin UI); these env vars override them for this deployment.
      TWENTY_CRM_API_KEY: ${TWENTY_CRM_API_KEY:-}
      TWENTY_API_URL: ${TWENTY_API_URL:-}
      # ── Optional: integrations that read env, NOT system_settings ────────
      # The portal's provider pages store most credentials in the database, but
      # these are read from the environment at runtime. A deployment that omits
      # them silently loses the feature — during the 2026-09-21 cutover the app
      # booted with "Failed to initialize Stripe: Stripe not configured" purely
      # because these were absent from the container's env.
      ACTION1_API_KEY: ${ACTION1_API_KEY:-}
      ACTION1_API_URL: ${ACTION1_API_URL:-}
      ACTION1_CLIENT_ID: ${ACTION1_CLIENT_ID:-}
      JUMPCLOUD_API_KEY: ${JUMPCLOUD_API_KEY:-}
      JUMPCLOUD_ORG_ID: ${JUMPCLOUD_ORG_ID:-}
      HUBSPOT_TOKEN: ${HUBSPOT_TOKEN:-}
      ITFLOW_API_KEY: ${ITFLOW_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      VOIP_USERNAME: ${VOIP_USERNAME:-}
      VOIP_PASSWORD: ${VOIP_PASSWORD:-}
      VOIP_TOKEN: ${VOIP_TOKEN:-}
      # Frontier runs against a test or production carrier environment; getting
      # this wrong points live pre-qualifications at the test system.
      FRONTIER_ENV: ${FRONTIER_ENV:-}
      DEBUG_MODE: ${DEBUG_MODE:-}
      # Mission Control bridge (the portal's agent-army view).
      MC_URL: ${MC_URL:-}
      MC_AUTH_TOKEN: ${MC_AUTH_TOKEN:-}
      # Alternative admin password representation used by the seed/login path.
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
    ports:
      # BIND_ADDRESS controls which host interfaces the app is published on.
      # Default 0.0.0.0 suits a fresh deployment behind a reverse proxy. On a host
      # with a PUBLIC interface, never leave the default: Docker's published ports
      # bypass UFW entirely (its INPUT rules are not consulted — Docker inserts its
      # own DOCKER-USER/DOCKER chains first), so 0.0.0.0 puts the app on the
      # internet with no TLS and no Cloudflare in front. Set it to the address the
      # proxy/tunnel actually dials (e.g. BIND_ADDRESS=10.0.0.2) to keep the
      # listener off the public interface.
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-3000}:3000"
    healthcheck:
      # Built-in health route: GET /?health → 200 {"status":"ok"}
      # Use the IPv4 literal: inside the container `localhost` resolves to ::1
      # first, where the app is not listening, so the check could never pass.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/?health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [portal]

  # Nightly logical backup of the bundled database. Keeps the last
  # ${BACKUP_RETENTION_DAYS} days in the portal_backups volume and never leaves
  # the host by itself — copy them off-host (see DEPLOY.md, "Backups").
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Set explicitly rather than relying on the script's defaults: the official
      # postgres images ship a PGHOST that points at a local socket, and unexported
      # shell defaults are invisible to pg_dump.
      PGHOST: db
      PGUSER: portal
      PGDATABASE: bluemogul_portal
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    entrypoint: ["/bin/sh", "/backup/run-backup.sh"]
    volumes:
      - ./scripts/backup:/backup:ro
      - portal_backups:/backups
    networks: [portal]

volumes:
  portal_pgdata:
  portal_backups:

networks:
  portal:
    driver: bridge